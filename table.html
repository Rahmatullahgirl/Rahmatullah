.container{width:min(1100px,92%);margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 22px;background:rgba(15,30,40,.88);border:1px solid rgba(255,255,255,.18);border-radius:20px;box-shadow:0 12px 35px rgba(0,0,0,.3);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:82px;height:62px;object-fit:contain}
.brand h1{font-size:28px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
nav a{color:white;text-decoration:none;padding:10px 13px;border-radius:20px;font-weight:bold;transition:.3s}
nav a:hover{background:#ffb347;color:#222}
.hero{margin-top:30px;min-height:65vh;padding:60px 25px;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.22);border-radius:28px;box-shadow:0 18px 45px rgba(0,0,0,.3);backdrop-filter:blur(6px)}
.hero-content{max-width:850px}
.hero h2{font-size:clamp(2.5rem,7vw,5rem);margin-bottom:18px;text-shadow:0 5px 20px rgba(0,0,0,.6)}
.hero p{font-size:1.15rem;line-height:1.7;margin-bottom:28px}
.hero-buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:14px}
.hero-btn{display:inline-block;padding:13px 25px;border-radius:30px;text-decoration:none;font-weight:bold;transition:.3s}
.primary{background:#ffb347;color:#222}
.secondary{color:white;border:2px solid white}
.hero-btn:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.gallery{margin-top:35px;display:flex;justify-content:center;flex-wrap:wrap;gap:18px}
.gallery img{width:175px;height:130px;object-fit:cover;border-radius:16px;border:3px solid white;box-shadow:0 8px 22px rgba(0,0,0,.35);transition:.3s}
.gallery img:hover{transform:scale(1.06) translateY(-5px)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:25px}
.card{background:rgba(255,255,255,.94);color:#263740;padding:30px 20px;border-radius:20px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:.3s}
.card:hover{transform:translateY(-7px)}
